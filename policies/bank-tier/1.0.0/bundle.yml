apiVersion: bah.policy/v1
kind: bank.tier
name: bank-tier
version: 1.0.0
description: BAH 银行工具三级权限的默认判定规则（与 tier.ts legacy 逐条等价）
owners: [risk-platform]
schema: bank.tier.input/v1
engine: { min: 1.0.0, max: 1.x }
parameters:
  riskyCallThreshold: { type: integer, min: 1, max: 100 }
