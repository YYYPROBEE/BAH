# web profile patch（层 2）。
#
# 语义仍是**整块替换**（施工单 06 §0 第 3 条）：每行 config 一出现就完全取代 base 的值。
#
# 演示主路径：内置 router（离线、确定性；只认查余额 / 转账两种意图）
#   → 黄级 → Web 弹窗审批 → 核销 → 文本收尾。
# 前端连上后应看到：对话流两段气泡、工具卡三态（待执行→完成）、审批弹窗六要素、DAG、审计时间线。
# 知识问答**不在** router 的意图范围内：用 `pnpm demo:rag`（headless）单独演示；
# 若要在 Web 里问知识，按下面注释切 DeepSeek（需要网络 + BAH_MODEL_KEY）。
# 真实模型是可替换 provider 的证据，不是主路径；切换是手动改 profile，不是自动降级。

- id: core:model
  config:
    provider: router
    model: router-chat
    chunkSize: 4
    # ── 可替换真实模型（DeepSeek V4.1 Flash / DashScope 兼容端点）──
    # 切换时必须**同时**改这里与 core:agent.loop.model（两处成对，见 docs/deploy.md）：
    # 把上面三行换成下面整块，并把 loop.model 改成 deepseek:deepseek-v4.1-flash-1017。
    # provider: deepseek
    # model: deepseek-v4.1-flash-1017
    # baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
    # apiKeyEnv: BAH_MODEL_KEY
    # modelSpec:
    #   displayName: DeepSeek V4.1 Flash（DashScope 兼容端点）
    #   contextWindow: 131072
    #   toolCall: true
    #   reasoning: false
    # requestTimeoutMs: 30000
    # retryMax: 2
    # retryBaseMs: 300
    # # D2 成本：单位是**微元/百万 token**（整数，金额不碰浮点）。
    # # 这三个价是**演示占位价**（输入 2 元 / 缓存 0.5 元 / 输出 8 元每百万 token），
    # # 不是任何官方报价；真实账单必须由部署方按合同核价后改这三行。
    # # 不写这块 `usage/summary.costMicroYuan` 恒为 0——router 是本地生成、零上游成本，
    # # 所以主路径显示 0 元是**正确**的，不是"没配"。
    # pricing:
    #   inputPerMTok: 2000000
    #   cachedInputPerMTok: 500000
    #   outputPerMTok: 8000000

# C04 演示确定性：Web 演示进程的单会话日志不需要逐条 fsync。
# 关掉后每次 append 不再阻塞在磁盘同步上，避免现场"点批准后气泡卡住"。
# 代价是进程被硬杀时可能丢最后几条事件——演示用重启可复现的种子数据兜底。
- id: core:persistence
  config:
    root: sessions
    fsync: false

- id: bank:tools
  config:
    demoUserId: u-1
    seed: 7
    datasetTier: demo

# 知识平面（施工单 12）：base bundle **不含**此行，web 必须显式开。
# 不开就没检索：`knowledge_answer` / `knowledge_query` 两个工具根本不存在于注册表，
# 模型也看不到（工具 schema 按注册表装配）。
- id: bank:knowledge
  use: bank:knowledge
  config:
    mode: http
    baseUrl: http://127.0.0.1:7801
    channel: web
    # 演示要求 RAG sidecar 先起（pnpm rag:dev / pnpm demo:rag）；
    # required=false 让 sidecar 缺席时降级为 knowledge-unavailable（fail-closed），
    # 而不是把整个站点顶掉——但那样"检索增强"就只剩壳，演示前必须确认探活通过。
    # 鉴权 fail-loud：sidecar 与宿主必须用同一 BAH_KNOWLEDGE_TOKEN（见 docs/knowledge.md）。
    required: false

- id: interaction:approval
  config:
    # Web 有弹窗：不设自动应答者，等人点（默认结论 unavailable = 拒绝，绝不默认放行）
    responder: none

- id: safety:sentry
  config:
    # W08：审计 trace 显式落 durable 会话事件；缺省不再退化为内存环。
    trace:
      sink: session
    rules:
      crossScenario: true

- id: core:agent
  config:
    # 唯一与 headless 不同的核心配置：渠道语气（模型同为离线 router）
    channel: web
    loop:
      # 切 DeepSeek 时必须与 core:model 同步改成 deepseek:deepseek-v4.1-flash-1017
      model: router:router-chat
      maxSteps: 8
      # 与 headless 同阈值：压缩只在长会话（> 8 turn）才触发，
      # 演示那两幕不会触发，所以不会污染"对话流可回放"的验收。
      compaction: { maxTurns: 8, keepRecentTurns: 3 }
    runtimeContext:
      user: { name: 张三, level: 金卡 }
      notes:
        - 本对话运行在仿真数据集（demo 档），账户与金额均为造数，不产生真实资金变动。

# C4 跨会话记忆（`bah:memory-store`）。
#
# base bundle **不含**此行：记忆会改变模型输入，不做静默开启，由 profile 显式写。
# 三条接线（写入 `turn/end` / 召回 `agent/pre-step` / 注入提示词段）见
# `packages/host/src/boot/plugins/memory.ts` 的模块注释。
#
# dbPath 放在会话根下（与 `core:persistence.root` 同根）：换 `--jsonl` 目录时记忆跟着走，
# 不会出现"日志在 A 目录、记忆在 B 目录"的分裂。
# 诚实边界：单租户（tenant 写死 demo）、影子核验未接（记忆不会被银行权威状态覆盖）。
- id: bah:memory-store
  use: bah:memory-store
  config:
    dbPath: sessions/memory.db
    tenant: demo
    userId: u-1
    sensitivityCeiling: 2

- id: demo:echo
  use: demo:echo
  config: { prefix: '[web] ' }

# 渠道行（施工单 13）：前端作为插件模块接入。
# 必须放在 interaction:approval 之后 —— 本行 inject 审批服务，直接注册 Web 应答者。
- id: channel:web
  use: channel:web
  config:
    port: 7331
    host: 127.0.0.1
    # 纯原生 ES 模块：静态目录直接指向源码，不需要先 build
    staticRoot: apps/web
    heartbeatMs: 15000
