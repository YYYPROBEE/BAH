# web profile patch（层 2）。
#
# 语义仍是**整块替换**（施工单 06 §0 第 3 条）：每行 config 一出现就完全取代 base 的值。
#
# 演示脚本（与 headless 幕 3 一致）：给王建国转 800 元 → 黄级 → Web 弹窗审批 → 核销 → 文本收尾。
# 前端连上后应看到：对话流两段气泡、工具卡三态（待执行→完成）、审批弹窗六要素、DAG、审计时间线。

- id: core:model
  config:
    provider: mock
    model: mock-chat
    chunkSize: 4
    script:
      - tool:
          id: call-1
          name: transfer_create
          args:
            amount: 800
            payee:
              name: 王建国
              phone: '13900002222'
            remark: 房租
      - text: 已为你在模拟环境完成 800 元转账（黄色级别，已审批并核销）。风险与票据可在右侧审计面板复核。

- id: bank:tools
  config:
    demoUserId: u-1
    seed: 7
    datasetTier: demo

- id: interaction:approval
  config:
    # Web 有弹窗：不设自动应答者，等人点（默认结论 unavailable = 拒绝，绝不默认放行）
    responder: none

- id: safety:sentry
  config:
    rules:
      crossScenario: true

- id: core:agent
  config:
    # 唯一与 headless 不同的核心配置：渠道语气
    channel: web
    loop: { model: mock:mock-chat, maxSteps: 8 }
    runtimeContext:
      user: { name: 张三, level: 金卡 }

- id: demo:echo
  use: demo:echo
  config: { prefix: '[web] ' }

# 渠道行（施工单 13）：前端作为插件模块接入。
# 必须放在 interaction:approval 之后 —— 本行 inject 审批服务，直接注册 Web 应答者。
- id: channel:web
  use: channel:web
  config:
    port: 7331
    host: 127.0.0.1
    # 纯原生 ES 模块：静态目录直接指向源码，不需要先 build
    staticRoot: apps/web
    heartbeatMs: 15000
