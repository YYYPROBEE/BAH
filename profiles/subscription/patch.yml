# subscription profile patch（场景 5：订阅 / 代扣）。
#
# 语义与其它 profile 一致：整块替换，不深合并。
# 数据档 = `recurring`（固定脚本，6 个月周期序列、脏商户名、断供失败样本）；
# `demo` 档保持字节不变（7 份快照与静态画像都钉在它上面）。

- id: core:model
  config:
    provider: router
    model: router-chat
    chunkSize: 4

- id: bank:tools
  config:
    # 主体与 profiles/*/patch.yml 的静态画像一致（张三）；不一致会触发 slots-user-mismatch
    demoUserId: u-1
    seed: 7
    datasetTier: recurring
    # 策略外置 S3：判决走内容寻址的外置规则
    policy: { engine: bundle }
    # 实体槽位的数据层预算（与 web 同口径；只有 core:agent.slots.source=bank 时才被读）
    contextSlots:
      accounts: 3
      transactions: 3
      subscriptions: 3
      windowDays: 30
      timeoutMs: 250
      maxChars: 800
      breakerFailures: 3
      breakerOpenMs: 10000

- id: interaction:approval
  config:
    # ★ ADR-0010：删掉 `autoDecision: allow`。
    #
    # 之前靠 headless 自动应答把「一键取消订阅」这类黄级操作也一起放行了——
    # 那是把回归夹具当生产语义。取消是**用户自己**要做的决定，不是系统替他做的。
    #
    # 现在：`responder: none`（没有人 = 拒绝）+ `windowResponder: true`
    # （只有到期唤醒的窗口票据能代签）。订阅评测场景若需要"批准"，
    # 必须显式带窗口凭据或在用例里装自己的应答者（见 eval runner 的 allow 行）。
    responder: none
    windowResponder: true

- id: safety:sentry
  config:
    trace:
      sink: session
    rules:
      crossScenario: true
    budget:
      # 与上方的演示用量对齐：3 次非绿调用 × 2 倍余量（审查 D-07）
      riskyCalls: 6

- id: core:agent
  config:
    channel: headless
    loop:
      model: router:router-chat
      maxSteps: 8
      compaction: { maxTurns: 8, keepRecentTurns: 3 }
    runtimeContext:
      user: { name: 张三, level: 金卡 }
      notes:
        - 本对话运行在仿真数据集（recurring 档）：6 个月订阅/代扣流水，均为造数，不产生真实资金变动。
