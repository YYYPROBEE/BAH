# headless · Saga 接线证据 overlay（层 4，`--patch` 叠层）
#
# 作用只有一个：把 `bank:saga-bridge` 的 tick 间隔压到 200ms，让"收敛 job 真的被派发"
# 在一次演示里可见（base bundle 里是 60s，演示来不及触发）。
#
# 语义是**整块替换**：本行的 config 一旦出现就完全取代 base 那一行——
# 所以 `enabled` / `eligible` / `saga` 必须重述，不能只写 `tickIntervalMs`。
#
# 配套证据脚本：`npx tsx scripts/verify-saga-wiring.ts`

- id: bank:saga-bridge
  config:
    enabled: true
    eligible: ['transfer_create']
    # 200ms 只为演示；生产用 base bundle 的 60s（janitor/recon/anchor 都是分钟级任务）
    tickIntervalMs: 200
    # 安全约束：幂等键没传给银行核心，重试 = 真的多扣一次钱
    saga: { maxAttempts: 1 }

# 门禁自己的"演示转账"需要人批准，但 headless 里没有第二个人。
# 这里是对**回归夹具**的显式放行，不是生产默认：base patch 的 `responder: none`
# 保持不变，只有本 overlay 叠上来时才装 headless 应答者。
# 负控：把 autoDecision 改回 reject，本门禁应重新红（证明批准确实来自这一行）。
- id: interaction:approval
  config:
    responder: headless
    autoDecision: allow
    autoVerify: true
    windowResponder: false
