# headless profile patch（层 2：profile patch）。
#
# 语义是**整块替换**（施工单 06 §0 第 3 条）：下面每行的 config 一旦出现，
# 就完全取代 base 那一行的 config——没写的字段走插件默认值，而不是与旧值深合并。
# 所以 `core:model` 从 deepseek 换成 mock 只需重写这一行，不会有"残留的 deepseek 字段"。

- id: core:model
  config:
    provider: mock
    model: mock-chat
    chunkSize: 4
    # 脚本化对话：幕 3「给王建国转 800 元」——黄级审批 → 批准 → 核销 → 文本收尾。
    # demo 档的王建国是白名单收款人、首笔早于演示，所以 800 元走黄级（不升红）。
    script:
      - tool:
          id: call-1
          name: transfer_create
          args:
            amount: 800
            payee:
              name: 王建国
              phone: '13900002222'
            remark: 房租
      - text: 已为你在模拟环境完成 800 元转账（黄色级别，已审批并核销）。

- id: bank:tools
  config:
    # headless 显式绑定 demo 用户（王建国）；不写则所有业务工具 deny no-identity
    demoUserId: u-1
    seed: 7
    datasetTier: demo

- id: interaction:approval
  config:
    # headless 没有 Web 弹窗：显式开启自动应答者（默认 none = 拒绝，绝不默认放行）
    responder: headless
    autoDecision: allow
    autoVerify: true

- id: core:agent
  config:
    channel: headless
    loop: { model: mock:mock-chat, maxSteps: 8 }
    runtimeContext:
      user: { name: 张三, level: 金卡 }

# 插入新行：id 不在任何 bundle 里出现，所以必须写 use 指向依赖清单里的插件
- id: demo:echo
  use: demo:echo
  config: { prefix: '[headless] ' }

