<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>修改交易密码 · 安全页</title>
    <!--
      交易密码安全页（ADR-0014）。

      为什么它是一个独立页面而不是对话里的一张卡：**密码不能进模型上下文**。
      对话里的任何输入都会写进 `sessions/<sessionId>/session.jsonl`，而本页通过
      `POST /api/secure/password` 直接提交给服务端，明文既不回显、也不落日志。

      样式：三份 CSS 是本页所需的全部资源（DS 令牌 + 组件 + 页面局部样式），
      `verify-web` 的入口页清单会校验它们；本页**不加载**任何对话脚本。
    -->
    <link rel="stylesheet" href="./styles/ds/colors_and_type.css" />
    <link rel="stylesheet" href="./styles/ds/components.css" />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <main id="secure-password" class="app"></main>
    <script type="module" src="./src/password.js"></script>
  </body>
</html>
