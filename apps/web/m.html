<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover 是 env(safe-area-inset-*) 生效的前提：不加它，刘海屏与圆角屏的
      安全区变量恒为 0，底部抽屉会被系统手势条压住（施工单 02 §3.1 差异 1）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      theme-color 无法用 var()：meta 不是 CSS 上下文，只能写字面值。
      取 DS 令牌 --bg-base-default 的当前值（design/bah-ds/colors_and_type.css:198）。
      门禁 verify-mobile-shell I4b 机器比对二者：令牌改值 ⇒ 门禁红 ⇒ 必须同批改这里，
      杜绝"HTML 里长出一块裸色值飞地"。
    -->
    <meta name="theme-color" content="#FFFFFF" />
    <!--
      BAH DS 是 Light-only 基线（施工单 00 §11「不做暗色模式」）：显式声明 color-scheme，
      否则浏览器会按系统深色偏好给表单控件与滚动条套一层 UA 暗色样式。
    -->
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="./assets/icons/Bank.svg" type="image/svg+xml" />
    <title>智能银行助手</title>
    <!--
      访问凭证由 host 静态处理器注入：m.html 在 channel:mobile 的凭证入口白名单
      （profiles/mobile/patch.yml 的 entries）里，响应时会在 head 结束标记前插入一条
      与 index.html 同形的凭证 meta，并同时下发 CSRF cookie 与 cache-control: no-store。
      注入器（packages/host/src/boot/plugins/web-auth.ts）先剥除注释、再剥离同名 meta，
      所以本文件的注释里**不得出现** head 结束标记或凭证 meta 的字面量——注释里的示意文本
      曾把注入点带进注释，送达的 DOM 里没有真 meta，移动壳永远 401（2026-10-29 走查 P0-1）。
      这里也**不写占位 meta**：写了占位反而会在"未进白名单却被静态返回"时把假凭证交给前端。
      前端只读不回写（apps/web/src/transport.js:19）。
    -->
    <!--
      设计令牌与组件（BAH DS 自研设计系统，Light-only）。
      这两份是 design/bah-ds/ 的逐字节分发副本，由 verify-web 与 verify-mobile-shell I6 双重校验哈希；
      改样式请改 mobile.css，不要改这里（改了会被门禁打回）。
    -->
    <link rel="stylesheet" href="./styles/ds/colors_and_type.css" />
    <link rel="stylesheet" href="./styles/ds/components.css" />
    <link rel="stylesheet" href="./styles/mobile.css" />
  </head>
  <body>
    <!--
      空壳：全部 DOM 由 src/mobile/shell.js 生成（textContent 纪律，见 src/dom.js 头注释）。
      刻意不引 styles/app.css——那是桌面壳的页面局部样式；双壳各自独立，
      公共基座只有上面两份 DS 副本（施工单 00 D1、02 §3.1 差异 4）。
    -->
    <div id="app" class="m-shell"></div>
    <script type="module" src="./src/mobile/shell.js"></script>
  </body>
</html>
