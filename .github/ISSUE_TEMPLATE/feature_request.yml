name: 功能建议
description: 提出新能力、边界改进或文档改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目有一条硬规矩：**先证明边界，再谈能力**。请写清"这个能力由谁判决、失败时怎么停"，
        否则很难落地。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的缺口是什么？谁在什么场景下会被它卡住？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 尽量落到具体接缝：插件行 / 工具 spec / waterfall 钩子 / profile 配置键
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 边界与失败语义
      description: |
        失败时是 fail-closed 还是降级？需要新增审批/强验证吗？会不会新增事件键或工具？
        （事件表与工具契约是冻结面，新增要走契约文档变更）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过但放弃的做法，以及放弃原因
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 issue 与 docs/，确认不是已实现或被明确列为"不做"的能力
          required: true
        - label: 我理解本项目不接受"让模型自己决定要不要拦"这类设计
          required: true
