name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 本地 pnpm 可能配置了 npmmirror，审计端点不存在；CI 显式用官方源。
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production npm dependencies
        run: pnpm audit --prod --audit-level high

      # D3：dev 依赖也进审计。dev 不进运行时，所以阈值只对 critical 阻断——
      # 对 dev 也按 high 阻断会天天红，红的次数多了这条检查就等于不存在。
      - name: Audit all dependencies (含 dev，critical 阻断)
        run: pnpm audit --audit-level critical

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # D3：已改为**阻断**。原先 continue-on-error 是"先收集基线"，基线期结束；
    # 现在红了就是真发现，修依赖而不是关检查。
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r services/rag/requirements.txt --strict

  # D3 新增：软件物料清单（SBOM）。为什么必须有：没有清单就说不清"镜像里到底装了什么"，
  # 出事时无法反查受影响的依赖。CycloneDX JSON 是事实标准，能直接被 Dependency-Track 等消费。
  #
  # 供应链纪律：全部 action 锁 commit SHA（不是可移动的版本 tag）。
  # 2026-10-28 用 `git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<tag> refs/tags/<tag>^{}`
  # 解析真实 SHA 后替换；`# vN` 注释只是给人看的版本提示。
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: bah-sbom.cdx.json
          output-file: bah-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: bah-sbom.cdx.json
          retention-days: 30

  # D3 新增：密钥扫描。用 --only-verified：只报"能连上去验证有效"的凭据，
  # 避免把用例里的假 token（`demo-key-not-for-prod`）当成泄漏而天天红。
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout（完整历史：扫描的是提交历史，不只是当前树）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog（仅报已验真的凭据）
        uses: trufflesecurity/trufflehog@ce76ea8f54888c154de94d37f0681493e69193f8 # main（2026-10-28 HEAD）
        with:
          extra_args: --only-verified
