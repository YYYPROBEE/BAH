# BAH MonoRepo · 真实 CI（BAH 代码修改清单 2026-10-20 · B1.3）
#
# 设计要点：
# - 从**干净 clone** 安装并跑完整链路（install 在 workflow，`pnpm check` 在脚本）；
# - Node 固定 22.19.0（与 .nvmrc / engines 一致）；pnpm 由 packageManager 固定；
# - `BAH_SNAPSHOT_BASE` 显式从 PR base / push before 取，禁止“干净检出即绿”；
# - e2e 无 DEEPSEEK_API_KEY 时显式 SKIP（不算绿）；有密钥时零用例会红；
# - RAG Python 3.11 环境安装失败即整条流水线失败，不静默跳过。

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # W06：知识库签名门的固定**完整性测试密钥**（公开、非机密；生产用独立密钥重签）。
      # 库代码没有任何默认密钥——缺失时启动 fail-loud。
      BAH_KNOWLEDGE_KEY: "demo-key-not-for-prod"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # 默认值是比赛期的兼容端点；生产/公开仓请在仓库 Variables 里覆盖为
      # 官方端点或经批准的模型网关（readDeepSeekEnv 对空字符串回退官方端点）。
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://maas.qianwenaiapi.com/compatible-mode/v1' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4.1-flash-1017' }}

    steps:
      - name: Checkout（完整历史，用于快照基线）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.7

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install RAG dependencies
        run: python -m pip install -e "services/rag[dev]"

      - name: Resolve snapshot base
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # 基线必须是**本仓历史里存在**的提交：force push 之后，push 前的远端 HEAD
          # （github.event.before）不在新历史里，此时不退回就会因"基线不可解析"直接红。
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          elif [ -z "$(git diff --name-only "$BASE" HEAD)" ]; then
            # 基线可解析却与 HEAD 同树（force push 重写过历史时会出现）：差分为 0 个文件，
            # snapshot-fresh 会按设计拒绝在无差分下宣称快照可信。退回上一提交取真实差分。
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo "$BASE")"
          fi
          echo "BAH_SNAPSHOT_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Verify knowledge signature manifest
        # 一致性检查（W06）：清单必须与语料索引 / fixture 逐字节一致；不改文件。
        run: pnpm knowledge:sign --check

      - name: Run full check
        # 严格模式：未执行面（如无密钥的 e2e）不得算绿。用 `pnpm check` 会 SKIP 后退出 0，
        # Actions 显示通过而 e2e 实际没跑——这正是本仓库要避免的"假绿"。
        run: pnpm check:ci
