# BAH MonoRepo · 真实 CI（BAH 代码修改清单 2026-10-20 · B1.3）
#
# 设计要点：
# - 从**干净 clone** 安装并跑完整链路（install 在 workflow，`pnpm check` 在脚本）；
# - Node 固定 22.19.0（与 .nvmrc / engines 一致）；pnpm 由 packageManager 固定；
# - `BAH_SNAPSHOT_BASE` 显式从 PR base / push before 取，禁止“干净检出即绿”；
# - e2e 无 DEEPSEEK_API_KEY 时显式 SKIP（不算绿）；有密钥时零用例会红；
# - RAG Python 3.11 环境安装失败即整条流水线失败，不静默跳过。

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout（完整历史，用于快照基线）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install RAG dependencies
        run: python -m pip install -e "services/rag[dev]"

      - name: Resolve snapshot base
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "BAH_SNAPSHOT_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Run full check
        run: pnpm check
