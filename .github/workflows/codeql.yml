# CodeQL 静态分析（D3）
#
# 为什么带 `if`：CodeQL 需要 GitHub Advanced Security，**私有仓必须单独开通**；
# 公开仓免费。加个条件而不是不加，是为了让"没跑"表现为**明确的 skipped**，
# 而不是一条永远红的工作流——红久了就没人看了。
#
# 语言面：`javascript-typescript` 覆盖 packages / scripts / apps；Python 覆盖 services/rag。
#
# 说明：两个 action 用版本 tag 未锁 SHA（本单不能凭空编 SHA）；转正前按
# `gh api repos/github/codeql-action/git/refs/tags/v3` 查到 SHA 后替换。

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: codeql / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          # 只做安全查询：本仓库要的是"有没有洞"，不是风格建议
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: /language:${{ matrix.language }}
