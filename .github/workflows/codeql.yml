# CodeQL 静态分析（D3）
#
# 为什么带 `if`：CodeQL 需要 GitHub Advanced Security，**私有仓必须单独开通**；
# 公开仓免费。加个条件而不是不加，是为了让"没跑"表现为**明确的 skipped**，
# 而不是一条永远红的工作流——红久了就没人看了。
#
# 语言面：`javascript-typescript` 覆盖 packages / scripts / apps；Python 覆盖 services/rag。
#
# 说明：两个 action 都锁到同一个 SHA（v4.39.3）。**必须同版本**——init 写进去的
# 配置文件带版本号，analyze 版本不一致会直接报
# "Loaded a configuration file for version '4.39.3', but running version '3.39.1'" 并判红。
# 这也是 dependabot 把 init / analyze 拆成两个 PR 时必红的原因，故在
# `.github/dependabot.yml` 里把 `github/codeql-action/*` 归成一组。
# 换版时按 `git ls-remote --tags https://github.com/github/codeql-action 'refs/tags/v4*'` 取 SHA，
# 或 `gh api repos/github/codeql-action/git/ref/tags/v4.39.3` 看 peeled commit。

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: codeql / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # 只做安全查询：本仓库要的是"有没有洞"，不是风格建议
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
