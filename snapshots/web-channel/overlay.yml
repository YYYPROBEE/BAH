# web-channel 快照场景的层 4 overlay（施工单 13）。
#
# 目的：在 headless 底座上挂一次真正的 Web 渠道，并让整套流程**当场跑完**。
# 两处刻意配置：
# 1. `channel:web.port: 0` —— 端口由内核分配，录制/回放不会撞端口，也不会留下监听；
# 2. `core:agent.channel: web` —— 系统提示词的渠道段按 Web 裁剪（与 profiles/web 一致）。

- id: core:agent
  config:
    channel: web
    loop: { model: mock:mock-chat, maxSteps: 8 }
    runtimeContext:
      user: { name: 张三, level: 金卡 }

- id: demo:echo
  use: demo:echo
  config: { prefix: '[web] ' }

- id: channel:web
  use: channel:web
  config:
    port: 0
    host: 127.0.0.1
    staticRoot: apps/web
    heartbeatMs: 15000
